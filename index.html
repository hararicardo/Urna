<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Urna Eletrônica - Eleições 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600;700;800&display=swap');

    /* Fonts & Custom styling for LCD display and physical keypad */
    .lcd-font {
      font-family: 'Share Tech Mono', monospace;
    }

    .lcd-screen {
      background-color: #d8e2d4; /* Characteristic light greenish grey LCD tint */
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.25);
    }

    /* Keypad 3D bevel effects */
    .key-btn {
      background: linear-gradient(145deg, #2a2c30, #1c1d20);
      box-shadow: 2px 3px 5px rgba(0,0,0,0.5), inset 1px 1px 1px rgba(255,255,255,0.15);
      transition: all 0.05s ease;
      user-select: none;
    }

    .key-btn:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 2px rgba(0,0,0,0.6), inset 0px 0px 4px rgba(0,0,0,0.8);
    }

    .key-white {
      background: linear-gradient(145deg, #ffffff, #e6e6e6);
      color: #111;
      box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
    }

    .key-orange {
      background: linear-gradient(145deg, #ff8c00, #e06d00);
      color: #111;
      box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
    }

    .key-green {
      background: linear-gradient(145deg, #00ab44, #008233);
      color: #111;
      box-shadow: 2px 3px 5px rgba(0,0,0,0.4);
    }

    /* Braille dot styles */
    .braille-dot {
      width: 3px;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      display: inline-block;
    }

    /* Flashing text effect */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blink {
      animation: blink 1s infinite;
    }

    /* Custom Scrollbar for list modals */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #2d3748;
    }
    ::-webkit-scrollbar-thumb {
      background: #4a5568;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 select-none font-sans">

    <!-- Left Section: Screen and Logo Header -->

          <div class="w-1 h-3 bg-slate-700 rounded-full"></div>

      <!-- Screen Footer status -->

    <!-- Right Section: Keypad -->
    <div class="w-full lg:w-[320px] bg-zinc-800 p-4 sm:p-5 rounded-xl border-4 border-zinc-700 shadow-2xl flex flex-col justify-between items-center">
      
      <!-- Keypad Logo Header -->

        <span class="text-xs sm:text-sm font-bold text-zinc-300 tracking-wider">JUSTIÇA ELEITORAL</span>

      <!-- Numeric Keypad Grid (1-9, 0) -->
      <div class="grid grid-cols-3 gap-2 sm:gap-3 w-full max-w-[260px] mb-4">
        <!-- Buttons generated with JS/HTML -->
        <button onclick="pressKey('1')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('2')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('3')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('5')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">
          <span>5</span>

        <button onclick="pressKey('6')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('7')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('8')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('9')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

        <button onclick="pressKey('0')" class="key-btn h-12 sm:h-14 rounded-md text-white text-xl font-extrabold flex flex-col items-center justify-center relative border border-zinc-600">

      <!-- Action Buttons Row (BRANCO, CORRIGE, CONFIRMA) -->

  <!-- Bottom Helper Controls -->

    <button onclick="toggleAudio()" id="audio-toggle-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-semibold border border-slate-700 flex items-center gap-2 transition-all">
      <i class="fa-solid fa-volume-high"></i> Áudio: <span id="audio-status">LIGADO</span>
    </button>
    <button onclick="restartVoting()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-semibold border border-slate-700 flex items-center gap-2 transition-all">

  <!-- Candidate Cola Modal -->
  <div id="candidate-modal" class="fixed inset-0 bg-black/75 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 text-slate-100 rounded-xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-900">
        <h2 class="text-lg font-bold text-amber-400 flex items-center gap-2">
          <i class="fa-solid fa-clipboard-list"></i> Cola Eleitoral - Candidatos Simulated 2026
        </h2>
        <button onclick="closeCandidateList()" class="text-slate-400 hover:text-white font-bold text-xl px-2">
          &times;
        </button>
      </div>
      <div id="modal-candidate-content" class="p-4 overflow-y-auto space-y-6">

      </div>
      <div class="p-3 border-t border-slate-700 bg-slate-900 text-right">
        <button onclick="closeCandidateList()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-xs">
          Fechar Cola

    </div>
  </div>

  <script>
    /* =====================================================================
       1. AUDIO SYNTHESIZER (Web Audio API for real sound effects)
       ===================================================================== */
    let audioEnabled = true;
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audio-status').innerText = audioEnabled ? 'LIGADO' : 'DESLIGADO';
      document.getElementById('audio-toggle-btn').classList.toggle('text-slate-500', !audioEnabled);
      document.getElementById('audio-toggle-btn').classList.toggle('text-slate-300', audioEnabled);
    }

    // Play short keypress beep
    function playBeep() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1050, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    // Play classic TSE "PILILI" end sound tone
    function playPilili() {
      if (!audioEnabled) return;
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        
        // Tone sequence timing
        const duration = 0.15;
        const tones = [
          { freq: 440, start: 0 },
          { freq: 440, start: 0.16 },
          { freq: 440, start: 0.32 },
          { freq: 880, start: 0.48, dur: 0.6 }
        ];

        tones.forEach(t => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(t.freq, now + t.start);
          gain.gain.setValueAtTime(0.3, now + t.start);
          gain.gain.exponentialRampToValueAtTime(0.001, now + t.start + (t.dur || duration));
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + t.start);
          osc.stop(now + t.start + (t.dur || duration));
        });
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    /* =====================================================================
       2. CANDIDATES DATA SETUP (2026 ELECTIONS SIMULATION)
       ===================================================================== */
    const stages = [
      {
        key: 'deputado-federal',
        title: 'DEPUTADO FEDERAL',
        digits: 4,
        candidates: {
          '1000': { name: 'MARIA SILVA', party: 'PRB', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=MARIA+SILVA' },
          '1313': { name: 'CARLOS ZAMBIA', party: 'PT', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=CARLOS+Z' },
          '2222': { name: 'EDSON OLIVEIRA', party: 'PL', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=EDSON+O' },
          '3030': { name: 'RENATA SOUZA', party: 'NOVO', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=RENATA+S' },
          '5050': { name: 'GUILHERME CASTRO', party: 'PSOL', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=GUILHERME' }
        }
      },
      {
        key: 'deputado-estadual',
        title: 'DEPUTADO ESTADUAL',
        digits: 5,
        candidates: {
          '12345': { name: 'ALEXANDRE RIBEIRO', party: 'PDT', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=ALEXANDRE' },
          '13000': { name: 'ANA PAULA PRADO', party: 'PT', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=ANA+PAULA' },
          '22111': { name: 'ROBERTO FREITAS', party: 'PL', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=ROBERTO+F' },
          '45678': { name: 'LUCIA MENDOÇA', party: 'PSDB', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=LUCIA+M' }
        }
      },
      {
        key: 'senador',
        title: 'SENADOR',
        digits: 3,
        candidates: {
          '131': { name: 'MARCIO MACEDO', party: 'PT', substitute: '1º SUPL.: PAULO SILVA', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=MARCIO+M' },
          '222': { name: 'SERGIO MORO', party: 'UNIÃO', substitute: '1º SUPL.: LUIS FELIPE', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=S.+MORO' },
          '151': { name: 'SIMONE TEBET', party: 'MDB', substitute: '1º SUPL.: ALBERTO Z', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=S.+TEBET' },
          '300': { name: 'MARCEL VAN HATTEM', party: 'NOVO', substitute: '1º SUPL.: FABIO B', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=M.+VAN+HATTEM' }
        }
      },
      {
        key: 'governador',
        title: 'GOVERNADOR',
        digits: 2,
        candidates: {
          '10': { name: 'TARCÍSIO DE FREITAS', party: 'REPUBLICANOS', vice: 'VICE: FELICIO RAMUTH', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=TARCISIO' },
          '13': { name: 'FERNANDO HADDAD', party: 'PT', vice: 'VICE: LÚCIA FRANÇA', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=HADDAD' },
          '15': { name: 'Ronaldo Caiado', party: 'UNIÃO', vice: 'VICE: DANIEL VILELA', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=CAIADO' },
          '30': { name: 'ROMEU ZEMA', party: 'NOVO', vice: 'VICE: MATEUS SIMÕES', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=ROMEU+ZEMA' }
        }
      },
      {
        key: 'presidente',
        title: 'PRESIDENTE',
        digits: 2,
        candidates: {
          '13': { name: 'LUIZ INÁCIO LULA DA SILVA', party: 'PT', vice: 'VICE: GERALDO ALCKMIN', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=LULA' },
          '22': { name: 'TARCÍSIO / CANDIDATO PL', party: 'PL', vice: 'VICE: CANDIDATO VICE', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=CANDIDATO+PL' },
          '12': { name: 'CIRO GOMES', party: 'PDT', vice: 'VICE: CANDIDATO VICE', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=CIRO+GOMES' },
          '30': { name: 'ROMEU ZEMA', party: 'NOVO', vice: 'VICE: CANDIDATO VICE', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=ROMEU+ZEMA' },
          '15': { name: 'SIMONE TEBET', party: 'MDB', vice: 'VICE: CANDIDATO VICE', photo: 'https://placehold.co/120x150/1e293b/ffffff?text=SIMONE+TEBET' }
        }
      }
    ];

    /* =====================================================================
       3. STATE MANAGEMENT
       ===================================================================== */
    let currentStageIndex = 0;
    let enteredDigits = '';
    let isWhiteVote = false;
    let isFinished = false;
    let votesRecord = {};

    /* =====================================================================
       4. KEYPAD INTERACTION LOGIC
       ===================================================================== */
    function pressKey(num) {
      if (isFinished) return;
      if (isWhiteVote) return; // If white vote selected, numeric keys ignored until CORRIGE

      const stage = stages[currentStageIndex];
      if (enteredDigits.length < stage.digits) {
        playBeep();
        enteredDigits += num;
        updateScreen();
      }
    }

    function pressBranco() {
      if (isFinished) return;
      if (enteredDigits === '') {
        playBeep();
        isWhiteVote = true;
        updateScreen();
      }
    }

    function pressCorrige() {
      if (isFinished) return;
      playBeep();
      enteredDigits = '';
      isWhiteVote = false;
      updateScreen();
    }

    function pressConfirma() {
      if (isFinished) return;

      const stage = stages[currentStageIndex];
      let voteConfirmed = false;

      if (isWhiteVote) {
        votesRecord[stage.key] = 'BRANCO';
        voteConfirmed = true;
      } else if (enteredDigits.length === stage.digits) {
        const candidate = stage.candidates[enteredDigits];
        if (candidate) {
          votesRecord[stage.key] = enteredDigits;
        } else {
          votesRecord[stage.key] = 'NULO';
        }
        voteConfirmed = true;
      }

      if (voteConfirmed) {
        playBeep();
        enteredDigits = '';
        isWhiteVote = false;

        // Advance to next stage or finish
        currentStageIndex++;
        if (currentStageIndex < stages.length) {
          updateScreen();
        } else {
          showEndScreen();
        }
      }
    }

    /* =====================================================================
       5. SCREEN RENDERER
       ===================================================================== */
    function updateScreen() {
      const container = document.getElementById('screen-content');
      const stage = stages[currentStageIndex];

      // Handle White Vote state
      if (isWhiteVote) {
        container.innerHTML = `
          <div class="flex flex-col justify-between h-full uppercase font-bold lcd-font">
            <div class="text-xs sm:text-sm text-slate-700">SEU VOTO VAI PARA</div>
            <div class="text-xl sm:text-2xl tracking-wider my-2">${stage.title}</div>
            
            <div class="flex-1 flex items-center justify-center">
              <div class="text-2xl sm:text-4xl text-slate-900 border-2 border-slate-700 p-4 rounded text-center animate-pulse">
                VOTO EM BRANCO
              </div>
            </div>

            <div class="border-t-2 border-slate-700 pt-2 text-[10px] sm:text-xs text-slate-800 leading-tight">
              Aperte a tecla:<br/>
              <span class="font-black text-emerald-800">VERDE</span> para CONFIRMAR<br/>
              <span class="font-black text-amber-800">LARANJA</span> para REINICIAR
            </div>
          </div>
        `;
        return;
      }

      // Check entered digits for candidate match
      const candidate = stage.candidates[enteredDigits];
      const isComplete = enteredDigits.length === stage.digits;
      const isNull = isComplete && !candidate;

      // Construct digit boxes HTML
      let digitBoxesHTML = '';
      for (let i = 0; i < stage.digits; i++) {
        const char = enteredDigits[i] || '';
        const isBlinking = (i === enteredDigits.length && !isComplete);
        digitBoxesHTML += `
          <div class="w-7 h-9 sm:w-9 sm:h-11 border-2 border-slate-800 bg-emerald-50/50 text-slate-950 font-bold text-xl sm:text-2xl flex items-center justify-center ${isBlinking ? 'blink border-slate-900 bg-emerald-200/50' : ''}">
            ${char}
          </div>
        `;
      }

      // Render Active Stage Screen
      container.innerHTML = `
        <div class="flex flex-col justify-between h-full uppercase lcd-font text-slate-900">
          <div>
            <div class="text-[10px] sm:text-xs font-semibold text-slate-700">SEU VOTO VAI PARA</div>
            <div class="text-lg sm:text-2xl font-black tracking-wider my-1">${stage.title}</div>
            
            <div class="flex items-center gap-2 my-2">
              <span class="text-xs sm:text-sm font-bold">NÚMERO:</span>
              <div class="flex gap-1">
                ${digitBoxesHTML}
              </div>
            </div>
          </div>

          <!-- Candidate Details Area -->
          <div class="flex-1 flex justify-between items-start my-2">
            <div class="space-y-1 text-xs sm:text-sm">
              ${candidate ? `
                <div><span class="font-bold">NOME:</span> ${candidate.name}</div>
                <div><span class="font-bold">PARTIDO:</span> ${candidate.party}</div>
                ${candidate.vice ? `<div class="text-xs mt-1 text-slate-800 font-semibold">${candidate.vice}</div>` : ''}
                ${candidate.substitute ? `<div class="text-xs mt-1 text-slate-800 font-semibold">${candidate.substitute}</div>` : ''}
              ` : isNull ? `
                <div class="text-xl sm:text-2xl font-bold text-slate-900 mt-4 animate-pulse">
                  NÚMERO ERRADO<br/>
                  <span class="text-base sm:text-xl">VOTO NULO</span>
                </div>
              ` : ''}
            </div>

            <!-- Candidate Photo -->
            ${candidate ? `
              <div class="flex flex-col items-center">
                <img src="${candidate.photo}" alt="Foto Candidato" class="w-20 sm:w-24 h-24 sm:h-28 object-cover border-2 border-slate-800 rounded bg-slate-400" onerror="this.onerror=null; this.src='https://placehold.co/120x150/1e293b/ffffff?text=CANDIDATO';" />
              </div>
            ` : ''}
          </div>

          <!-- Bottom Prompt Instructions -->
          <div class="border-t-2 border-slate-700 pt-1 sm:pt-2 text-[10px] sm:text-xs leading-tight font-medium">
            Aperte a tecla:<br/>
            <span class="font-black text-emerald-900">VERDE</span> para CONFIRMAR<br/>
            <span class="font-black text-amber-900">LARANJA</span> para REINICIAR
          </div>
        </div>
      `;
    }

    /* =====================================================================
       6. END SCREEN & RESET
       ===================================================================== */
    function showEndScreen() {
      isFinished = true;
      playPilili();

      const container = document.getElementById('screen-content');
      container.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full lcd-font text-slate-950 my-auto">
          <div class="text-6xl sm:text-8xl font-black tracking-widest animate-pulse">
            F I M
          </div>
          <div class="text-xs sm:text-sm font-bold mt-4 tracking-widest text-slate-800">
            VOTAÇÃO ENCERADA
          </div>
        </div>
      `;

      // Log full votes summary to console for reference
      console.log('--- RESUMO DOS VOTOS REGISTRADOS ---', votesRecord);
    }

    function restartVoting() {
      currentStageIndex = 0;
      enteredDigits = '';
      isWhiteVote = false;
      isFinished = false;
      votesRecord = {};
      updateScreen();
    }

    /* =====================================================================
       7. CANDIDATE COLA MODAL
       ===================================================================== */
    function openCandidateList() {
      const modal = document.getElementById('candidate-modal');
      const content = document.getElementById('modal-candidate-content');
      
      let html = '';
      stages.forEach(st => {
        html += `
          <div class="border border-slate-700 rounded-lg p-3 bg-slate-800/80">
            <h3 class="font-bold text-amber-400 text-sm sm:text-base border-b border-slate-700 pb-1 mb-2">
              ${st.title} (${st.digits} dígitos)
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
        `;

        Object.keys(st.candidates).forEach(num => {
          const c = st.candidates[num];
          html += `
            <div class="bg-slate-900/90 p-2 rounded border border-slate-700/60 flex items-center justify-between">
              <div>
                <span class="text-amber-300 font-extrabold text-sm">${num}</span> - 
                <span class="font-bold text-slate-100">${c.name}</span> 
                <span class="text-slate-400">(${c.party})</span>
                ${c.vice ? `<div class="text-[10px] text-slate-400">${c.vice}</div>` : ''}
              </div>
              <button onclick="quickFill('${num}')" class="px-2 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 text-[10px] font-bold rounded">
                Votar
              </button>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
      });

      content.innerHTML = html;
      modal.classList.remove('hidden');
    }

    function closeCandidateList() {
      document.getElementById('candidate-modal').classList.add('hidden');
    }

    function quickFill(number) {
      if (isFinished) restartVoting();
      
      // Reset current stage input and fill number
      enteredDigits = '';
      isWhiteVote = false;
      
      for (let char of number) {
        pressKey(char);
      }
      closeCandidateList();
    }

    /* =====================================================================
       8. HARDWARE KEYBOARD EVENT LISTENERS
       ===================================================================== */
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        pressKey(e.key);
      } else if (e.key === 'Enter') {
        pressConfirma();
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        pressCorrige();
      } else if (e.key.toLowerCase() === 'b') {
        pressBranco();
      }
    });

    // Initial load trigger
    window.onload = function() {
      updateScreen();
    };
  </script>
</body>
</html>
